[package]
name = "tmux_sessionizer"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive", "string"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
skim = { version = "5.9.0", default-features = false }
toml = "1.2.2"

[dev-dependencies]
test-case = "3.4.1"

[[bin]]
name = "tms"
path = "src/main.rs"
